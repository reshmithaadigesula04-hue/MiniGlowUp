<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product - Mini GlowUp</title>
    <style>
        body { background-color: #fff0f5; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-box { background: #ffffff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4); width: 350px; }
        h2 { color: #d87093; text-align: center; }
        label { font-weight: bold; color: #555; display: block; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ffb6c1; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #ffb6c1; color: white; border: none; padding: 10px; width: 100%; border-radius: 20px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button:hover { background-color: #ff69b4; }
        a { display: block; text-align: center; margin-top: 15px; color: #db7093; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2> Add Skincare Product</h2>
        <form method="POST">
            {% csrf_token %}
            <label>Product Name:</label>
            <input type="text" name="name" required>
            
            <label>Category:</label>
            <select name="category">
                <option value="Cleanser">Cleanser</option>
                <option value="Moisturizer">Moisturizer</option>
                <option value="Sunscreen">Sunscreen</option>
                <option value="Other">Other</option>
            </select>

            <label>Description:</label>
            <textarea name="description" rows="3"></textarea>

            <button type="submit">Save Product</button>
        </form>
        <a href="{% url 'product_list' %}">← Back to Home</a>
    </div>
</body>
</html>
